name: Atualizar Catalogo (Agente IA)

on:
  push:
    branches: [main]
  schedule:
    # 09:00 e 21:00 UTC = 06:00 e 18:00 (São Paulo)
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checar repositório
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Instalar dependências
        working-directory: scripts
        run: npm ci

      - name: Verificar secrets configurados
        env:
          IA_KEY: ${{ secrets.GEMINI_API_KEY }}
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$IA_KEY"  || { echo "❌ Faltando secret: GEMINI_API_KEY"; exit 1; }
          test -n "$SA_KEY"  || { echo "❌ Faltando secret: FIREBASE_SERVICE_ACCOUNT"; exit 1; }

      - name: Rodar agente de IA (pesquisa + atualiza catálogo)
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAX_ENTRIES: ${{ vars.MAX_ENTRIES }}
        run: node 8_ia_atualizar_veiculos.js