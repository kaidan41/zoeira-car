name: Gerar imagens faltantes (10/dia)

on:
  schedule:
    - cron: '0 9 * * *'  # 06:00 BRT
    - cron: '0 21 * * *' # 18:00 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências (firebase-admin)
        working-directory: scripts
        run: npm ci

      - name: Gerar lote de imagens (Pollinations)
        env:
          BATCH: ${{ vars.IMG_BATCH || '12' }}
        run: node scripts/generate_missing_images.js
        timeout-minutes: 30

      - name: Atualizar Firestore com thumbnails
        if: hashFiles('assets/images/vehicles/*.jpg') != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BATCH: ${{ vars.IMG_BATCH || '12' }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > scripts/serviceAccountKey.json 2>/dev/null || echo "$FIREBASE_SERVICE_ACCOUNT" > scripts/serviceAccountKey.json
            # Carros que só existem no Firestore (agente IA) sem imagem
            node scripts/12_gerar_imagens_firestore.js || echo "gerador firestore falhou"
            # Aponta thumbnails vazios/externos p/ assets locais (cobre carros da IA).
            # NOTA: não roda o 5_popular_veiculos.js aqui — o sync do catálogo é
            # responsabilidade de quem edita o seed; rodá-lo com seed defasado
            # sobrescreve dados novos (ex.: fipe_code) no Firestore.
            node scripts/11_sync_thumbnails.js || echo "sync thumbnails falhou"
            rm -f scripts/serviceAccountKey.json
          else
            echo "Sem FIREBASE_SERVICE_ACCOUNT, pulando seed"
          fi

      - name: Commitar lote
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nada para commitar"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: gera lote de imagens IA + thumbnails" || true
          # O repo pode ter avançado enquanto gerávamos: sincroniza e tenta de novo
          for i in 1 2 3; do
            if git push origin main 2>/dev/null; then
              echo "Push OK na tentativa $i"
              exit 0
            fi
            echo "Push falhou (tentativa $i/3), sincronizando com origin/main..."
            git fetch origin
            git rebase origin/main --autostash 2>/dev/null || {
              echo "Conflito no rebase, abortando e tentando stash..."
              git rebase --abort 2>/dev/null || true
              git stash 2>/dev/null || true
              git reset --hard origin/main
              git stash pop 2>/dev/null || true
              git add -A
              git commit -m "chore: gera lote de imagens IA + thumbnails" || true
            }
            sleep 3
          done
          # última tentativa após sincronização
          git push origin main || exit 1