name: Deploy Play Store (Teste Interno)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Track de publicação'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - closed_testing
          - open_testing
          - production

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build AAB & Upload Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'
          cache: true

      - name: Instalar dependências Flutter
        run: flutter pub get

      - name: Ajustar gradle.properties para ambiente Linux
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties || true

      - name: Validar secrets de assinatura e Play Store
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -e
          [ -n "$KEYSTORE_B64" ] || { echo "::error::Secret KEYSTORE_BASE64 ausente. Rode scripts/configurar_secrets_ci.ps1 para gerar os valores e adicione no GitHub (Settings > Secrets)."; exit 1; }
          [ -n "$STORE_PASS" ] || { echo "::error::Secret KEY_STORE_PASSWORD ausente."; exit 1; }
          [ -n "$KEY_PASS" ] || { echo "::error::Secret KEY_PASSWORD ausente."; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::Secret KEY_ALIAS ausente (esperado: zoeira_car)."; exit 1; }
          [ -n "$PLAY_JSON" ] || { echo "::error::Secret PLAY_STORE_SERVICE_ACCOUNT_JSON ausente. Crie a conta de serviço no Play Console > Configuração > Acesso à API e cole o JSON."; exit 1; }
          echo "Todos os secrets estão configurados ✓"

      - name: Decodificar Keystore e Configurar Assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > android/app/upload-keystore.jks
          ls -la android/app/upload-keystore.jks
          cat > android/key.properties << EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          storeType=pkcs12
          EOF
          # Falha rápida com mensagem clara se o keystore estiver inválido
          keytool -list -keystore android/app/upload-keystore.jks \
            -storetype pkcs12 -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -noprompt >/dev/null 2>&1 \
            || { echo "::error::Keystore inválido ou alias errado. Confira KEYSTORE_BASE64 (base64 de android/app/zoeira_car.jks) e KEY_ALIAS (esperado: zoeira_car)."; exit 1; }
          echo "Keystore validado ✓"

      - name: Analisar código
        run: flutter analyze --no-fatal-infos 2>&1 | head -100

      - name: Build App Bundle (Release)
        run: flutter build appbundle --release

      - name: Upload AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Mapear track sugestivo para Play Console
        run: |
          if [ "${{ github.event.inputs.track }}" = "closed_testing" ]; then
            echo "PLAY_TRACK=beta" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.track }}" = "open_testing" ]; then
            echo "PLAY_TRACK=alpha" >> $GITHUB_ENV
          else
            echo "PLAY_TRACK=${{ github.event.inputs.track }}" >> $GITHUB_ENV
          fi
        shell: bash

      - name: Publicar no Google Play (${{ github.event.inputs.track || 'internal' }})
        uses: r0adkll/upload-google-play@v1.1.0
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.zoeiracartv.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ env.PLAY_TRACK }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
          inAppUpdatePriority: 5
