name: zoeira_car
description: Aplicativo oficial do canal Zoeira Car - Entretenimento automotivo raiz!
publish_to: 'none'
version: 1.0.1+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navegação
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0

  # YouTube / Player de vídeo
  webview_flutter: ^4.4.4
  http: ^1.2.1
  xml: ^6.5.0

  # Pagamento in-app
  in_app_purchase: ^3.1.13
  in_app_purchase_android: ^0.3.5

  # Estado
  provider: ^6.1.2

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  url_launcher: ^6.2.6
  intl: ^0.19.0

  # Icones
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/vehicles/
    - assets/fonts/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
